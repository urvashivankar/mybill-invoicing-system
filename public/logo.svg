<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3730A3" flood-opacity="0.3"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Main rounded square background -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner glow -->
  <rect x="24" y="24" width="192" height="192" rx="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Document body -->
  <g filter="url(#innerShadow)">
    <path d="M 72 50 L 148 50 L 170 74 L 170 185 Q 170 192 163 192 L 79 192 Q 72 192 72 185 Z" fill="url(#docGrad)"/>
  </g>
  
  <!-- Folded corner -->
  <path d="M 148 50 L 148 74 L 170 74 Z" fill="#C7D2FE" opacity="0.9"/>
  
  <!-- Document header line -->
  <rect x="86" y="62" width="48" height="5" rx="2.5" fill="#A5B4FC" opacity="0.7"/>
  
  <!-- Invoice lines -->
  <rect x="86" y="86" width="70" height="6" rx="3" fill="#CBD5E1" opacity="0.6"/>
  <rect x="86" y="100" width="55" height="6" rx="3" fill="#CBD5E1" opacity="0.45"/>
  <rect x="86" y="114" width="62" height="6" rx="3" fill="#CBD5E1" opacity="0.35"/>
  
  <!-- Rupee symbol -->
  <text x="98" y="170" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="url(#rupeeGrad)" opacity="0.85">₹</text>
  
  <!-- Green verification badge -->
  <circle cx="168" cy="168" r="26" fill="url(#checkGrad)" stroke="#fff" stroke-width="4"/>
  <path d="M 156 168 L 163 175 L 179 157" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
